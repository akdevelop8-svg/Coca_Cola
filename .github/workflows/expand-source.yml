name: Expand one-time production source package
on:
  push:
    branches: [main]
    paths:
      - '.deploy-parts/**'
permissions:
  contents: write
jobs:
  expand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Materialize source and commit clean project files
        shell: bash
        run: |
          if [ ! -d .deploy-parts ]; then echo 'Source package already expanded.'; exit 0; fi
          node scripts/materialize-source.mjs --cleanup
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply Coca-Cola production source files'
          git push
